<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="500" viewBox="0 0 1440 500" role="img" aria-labelledby="title desc">
<title id="title">Srinibas Das — Galactic Engineering Portfolio</title>
<desc id="desc">A Star-Wars-inspired animated engineering universe. Five character archetypes represent building, reliability, curiosity, independent thinking and architecture. Lightsaber-like signal beams travel through a holographic system map.</desc>
<defs>
  <linearGradient id="space" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050916"/><stop offset=".52" stop-color="#10172B"/><stop offset="1" stop-color="#211A3E"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#FDE68A"/><stop offset=".5" stop-color="#F59E0B"/><stop offset="1" stop-color="#FDE68A"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#BFDBFE"/><stop offset=".5" stop-color="#60A5FA"/><stop offset="1" stop-color="#BFDBFE"/></linearGradient>
  <linearGradient id="green" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#D9F99D"/><stop offset=".5" stop-color="#84CC16"/><stop offset="1" stop-color="#D9F99D"/></linearGradient>
  <linearGradient id="white" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#FFFFFF"/><stop offset=".5" stop-color="#C4B5FD"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient>
  <linearGradient id="red" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#FECACA"/><stop offset=".5" stop-color="#EF4444"/><stop offset="1" stop-color="#FECACA"/></linearGradient>
  <radialGradient id="nebula"><stop stop-color="#4F46E5" stop-opacity=".28"/><stop offset="1" stop-color="#4F46E5" stop-opacity="0"/></radialGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#17233B" stop-opacity=".94"/><stop offset="1" stop-color="#0A1020" stop-opacity=".94"/></linearGradient>
  <filter id="glow" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="14"/></filter>
  <pattern id="stars" width="160" height="120" patternUnits="userSpaceOnUse">
    <circle cx="14" cy="18" r="1.1" fill="#E0E7FF" opacity=".7"/><circle cx="77" cy="42" r=".8" fill="#BFDBFE" opacity=".5"/>
    <circle cx="120" cy="13" r="1" fill="#FFF" opacity=".65"/><circle cx="48" cy="93" r=".9" fill="#C4B5FD" opacity=".7"/>
    <circle cx="146" cy="86" r=".7" fill="#FFF" opacity=".55"/><circle cx="95" cy="108" r=".7" fill="#93C5FD" opacity=".6"/>
  </pattern>
</defs>

<!-- Deep-space stage -->
<rect width="1440" height="500" rx="25" fill="url(#space)"/>
<rect width="1440" height="500" rx="25" fill="url(#stars)"/>
<ellipse cx="1080" cy="250" rx="460" ry="330" fill="url(#nebula)"/>
<g fill="#DDE7FF">
  <circle cx="600" cy="72" r="1.5"><animate attributeName="opacity" values=".2;1;.2" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="640" cy="380" r="1.2"><animate attributeName="opacity" values="1;.25;1" dur="2.5s" repeatCount="indefinite"/></circle>
  <circle cx="1370" cy="300" r="1.4"><animate attributeName="opacity" values=".2;.9;.2" dur="3.4s" repeatCount="indefinite"/></circle>
  <circle cx="1190" cy="30" r="1"><animate attributeName="opacity" values=".2;1;.2" dur="2.2s" repeatCount="indefinite"/></circle>
  <circle cx="520" cy="230" r="1.1"><animate attributeName="opacity" values=".2;.9;.2" dur="4s" repeatCount="indefinite"/></circle>
</g>
<path d="M52 54V448" stroke="#64748B" stroke-opacity=".34"/>
<path d="M52 54V152" stroke="url(#gold)" stroke-width="3" stroke-linecap="round"/>

<!-- Identity bay -->
<g transform="translate(92 70)">
