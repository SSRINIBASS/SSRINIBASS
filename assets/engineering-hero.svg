  <circle r="8" fill="#F8D477" filter="url(#glow)"><animate attributeName="r" values="6;10;6" dur="2.1s" repeatCount="indefinite"/></circle>
  <text x="0" y="92" text-anchor="middle" fill="#E2E8F0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" letter-spacing="1.5">SYSTEMS CORE</text>
  <text x="0" y="107" text-anchor="middle" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="8" letter-spacing="1.2">IDEA → IMPACT</text>
</g>

<!-- Connection routes and traveling signals -->
<g fill="none" stroke="#8EA3D4" stroke-width="1.5" stroke-opacity=".55">
