  <circle cx="18" cy="17" r="4" fill="#FBBF24" filter="url(#glow)"><animate attributeName="r" values="3;5;3" dur="1.8s" repeatCount="indefinite"/></circle>
  <text x="32" y="22" fill="#E6D6B2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" letter-spacing="1.8">GALACTIC ENGINEERING / 01</text>
  <text x="0" y="124" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="58" font-weight="750" letter-spacing="-1.8">SRINIBAS DAS</text>
  <path d="M0 148H360" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
  <path d="M0 148H96" stroke="url(#gold)" stroke-width="3" stroke-linecap="round"><animate attributeName="d" values="M0 148H96;M0 148H360;M0 148H96" dur="4.2s" repeatCount="indefinite"/></path>
  <text x="0" y="191" fill="#E2E8F0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="550">Software Engineer</text>
  <text x="1" y="226" fill="#A5B4FC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" letter-spacing="1.1">BACKEND SYSTEMS  /  AI PLATFORMS</text>
  <text x="1" y="251" fill="#A5B4FC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" letter-spacing="1.1">DISTRIBUTED WORKFLOWS  /  DEV TOOLING</text>
  <g transform="translate(0 295)">
    <rect width="390" height="58" rx="12" fill="#0B1325" stroke="#64748B" stroke-opacity=".35"/>
    <text x="16" y="21" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" letter-spacing="1.6">THE CODE</text>
    <text x="16" y="41" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">Build with purpose. Guard the system. Stay curious.</text>
  </g>
  <text x="0" y="394" fill="#64748B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" letter-spacing="1.5">INDEPENDENT FAN-INSPIRED ENGINEERING UNIVERSE</text>
</g>

<!-- Galaxy map / orbital paths -->
<g fill="none" stroke="#91A6D9" stroke-opacity=".26">
  <ellipse cx="1040" cy="250" rx="340" ry="185" transform="rotate(-12 1040 250)"/>
  <ellipse cx="1040" cy="250" rx="285" ry="145" transform="rotate(28 1040 250)"/>
