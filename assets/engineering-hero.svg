  <circle r="4" fill="#60A5FA"><animateMotion dur="4.8s" begin="-1.1s" repeatCount="indefinite" path="M1000 103 Q1003 160 1013 248"/></circle>
  <circle r="4" fill="#84CC16"><animateMotion dur="4.4s" begin="-2s" repeatCount="indefinite" path="M1225 141 Q1135 160 1013 248"/></circle>
  <circle r="4" fill="#C4B5FD"><animateMotion dur="5s" begin="-1.8s" repeatCount="indefinite" path="M1184 357 Q1100 330 1013 248"/></circle>
  <circle r="4" fill="#60A5FA"><animateMotion dur="4.6s" begin="-2.8s" repeatCount="indefinite" path="M853 369 Q900 330 1013 248"/></circle>
