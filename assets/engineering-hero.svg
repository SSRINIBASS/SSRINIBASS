<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="400" viewBox="0 0 1440 400" role="img" aria-labelledby="title desc">
  <title id="title">Srinibas Das — Software Engineer</title>
  <desc id="desc">Animated engineering portfolio banner. Data packets travel across a connected system map while nodes pulse and a scan beam moves through the network.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070C1B"/>
      <stop offset=".55" stop-color="#101A38"/>
      <stop offset="1" stop-color="#241C52"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset=".55" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#C4B5FD"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#6366F1" stop-opacity=".28"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#A5B4FC" stroke-opacity=".075" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="wideGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1440" height="400" rx="26" fill="url(#bg)"/>
  <rect width="1440" height="400" rx="26" fill="url(#grid)"/>
  <ellipse cx="1110" cy="195" rx="390" ry="270" fill="url(#glow)"/>
  <ellipse cx="1110" cy="195" rx="260" ry="220" fill="none" stroke="#818CF8" stroke-opacity=".10"/>
  <ellipse cx="1110" cy="195" rx="195" ry="165" fill="none" stroke="#818CF8" stroke-opacity=".09"/>
  <path d="M72 65V334" stroke="#60A5FA" stroke-width="4" stroke-linecap="round" opacity=".8"/>
  <path d="M690 30V370" stroke="#93C5FD" stroke-opacity=".55" stroke-width="1.5"/>

  <!-- Identity -->
  <g transform="translate(104 62)">
    <rect x="0" y="0" width="260" height="37" rx="18.5" fill="#1E3A8A" fill-opacity=".48" stroke="#93C5FD" stroke-opacity=".42"/>
    <circle cx="18" cy="18.5" r="5" fill="#5EEAD4" filter="url(#softGlow)">
      <animate attributeName="opacity" values=".45;1;.45" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="r" values="4;5.5;4" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="34" y="23.5" fill="#BFDBFE" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" letter-spacing="1.6">ENGINEERING / SYSTEMS</text>
    <text x="0" y="122" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="60" font-weight="700" letter-spacing="-1.8">SRINIBAS DAS</text>
    <rect x="0" y="145" width="232" height="4" rx="2" fill="#334A87"/>
    <rect x="0" y="145" width="76" height="4" rx="2" fill="url(#accent)">
      <animate attributeName="x" values="0;156;0" dur="3.8s" repeatCount="indefinite"/>
    </rect>
    <text x="0" y="190" fill="#DCE7F8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="500">Software Engineer</text>
    <text x="1" y="231" fill="#A5B4FC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" letter-spacing=".9">BACKEND PLATFORMS  /  DISTRIBUTED WORKFLOWS</text>
    <text x="1" y="256" fill="#A5B4FC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" letter-spacing=".9">DEVELOPER TOOLING  /  AI SYSTEMS</text>
  </g>

  <!-- Animated network: system nodes and routes -->
  <g fill="none" stroke="#78A8FF" stroke-width="1.4" stroke-opacity=".57">
    <path d="M760 96L910 146L1080 76L1240 131L1370 72"/>
    <path d="M760 96L805 286L990 255L1165 316L1320 251L1370 72"/>
    <path d="M910 146L1045 176L1080 76"/>
    <path d="M1045 176L990 255L805 286"/>
    <path d="M1045 176L1220 206L1240 131"/>
    <path d="M1080 76L1220 206L1320 251"/>
    <path d="M1165 316L1220 206L1320 251"/>
    <path d="M910 146L990 255L1220 206"/>
    <path d="M1240 131L1370 72"/>
  </g>
  <g fill="none" stroke="#A5B4FC" stroke-opacity=".10" stroke-width="5" filter="url(#wideGlow)">
    <path d="M760 96L910 146L1080 76L1240 131L1370 72"/>
    <path d="M805 286L990 255L1165 316L1320 251"/>
  </g>

  <!-- Traveling signal packets -->
  <g filter="url(#softGlow)">
    <circle r="4.5" fill="#7DD3FC">
      <animateMotion dur="4.4s" repeatCount="indefinite" path="M760 96 L910 146 L1080 76 L1240 131 L1370 72"/>
    </circle>
    <circle r="3.7" fill="#C4B5FD">
      <animateMotion dur="5.1s" begin="-2.2s" repeatCount="indefinite" path="M805 286 L990 255 L1165 316 L1320 251 L1370 72"/>
    </circle>
    <circle r="3.5" fill="#67E8F9">
      <animateMotion dur="3.7s" begin="-1.3s" repeatCount="indefinite" path="M910 146 L1045 176 L1220 206 L1320 251"/>
    </circle>
    <circle r="3.2" fill="#A5B4FC">
      <animateMotion dur="4.8s" begin="-3s" repeatCount="indefinite" path="M760 96 L805 286 L990 255 L1220 206 L1240 131"/>
    </circle>
  </g>

  <!-- Pulsing network nodes -->
  <g filter="url(#softGlow)">
    <g fill="#7DD3FC">
      <circle cx="760" cy="96" r="6"><animate attributeName="r" values="5;8;5" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="1080" cy="76" r="6"><animate attributeName="r" values="5;8;5" dur="2.8s" begin="-.8s" repeatCount="indefinite"/></circle>
      <circle cx="1220" cy="206" r="6"><animate attributeName="r" values="5;8;5" dur="2.6s" begin="-1.5s" repeatCount="indefinite"/></circle>
      <circle cx="990" cy="255" r="5.5"><animate attributeName="r" values="4.5;7.5;4.5" dur="2.2s" begin="-.4s" repeatCount="indefinite"/></circle>
      <circle cx="1320" cy="251" r="5.5"><animate attributeName="r" values="4.5;7.5;4.5" dur="2.9s" begin="-1.1s" repeatCount="indefinite"/></circle>
    </g>
    <g fill="#C4B5FD">
      <circle cx="910" cy="146" r="5.5"><animate attributeName="r" values="4.5;7.5;4.5" dur="2.5s" begin="-.6s" repeatCount="indefinite"/></circle>
      <circle cx="1240" cy="131" r="6"><animate attributeName="r" values="5;8;5" dur="2.7s" begin="-1.7s" repeatCount="indefinite"/></circle>
      <circle cx="1165" cy="316" r="5.5"><animate attributeName="r" values="4.5;7.5;4.5" dur="2.3s" begin="-1s" repeatCount="indefinite"/></circle>
      <circle cx="805" cy="286" r="5"><animate attributeName="r" values="4;7;4" dur="2.6s" begin="-.2s" repeatCount="indefinite"/></circle>
    </g>
    <g fill="#F8FAFC">
      <circle cx="760" cy="96" r="2"/><circle cx="910" cy="146" r="2"/><circle cx="1080" cy="76" r="2"/>
      <circle cx="1240" cy="131" r="2"/><circle cx="1220" cy="206" r="2"/><circle cx="1165" cy="316" r="2"/>
    </g>
  </g>

  <!-- Moving scan beam and edge highlight -->
  <g opacity=".5">
    <rect x="0" y="28" width="2" height="340" fill="#93C5FD" filter="url(#softGlow)">
      <animate attributeName="x" values="690;1390;690" dur="7.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".15;.8;.15" dur="7.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Systems-in-motion indicator -->
  <g transform="translate(1124 30)">
    <rect width="252" height="32" rx="16" fill="#0C1835" fill-opacity=".82" stroke="#91A7E8" stroke-opacity=".35"/>
    <g fill="#7DD3FC">
      <rect x="15" y="13" width="4" height="7" rx="2"><animate attributeName="height" values="4;13;4" dur=".8s" repeatCount="indefinite"/><animate attributeName="y" values="14.5;10;14.5" dur=".8s" repeatCount="indefinite"/></rect>
      <rect x="24" y="11" width="4" height="11" rx="2"><animate attributeName="height" values="11;5;11" dur="1s" repeatCount="indefinite"/></rect>
      <rect x="33" y="13" width="4" height="7" rx="2"><animate attributeName="height" values="4;13;4" dur=".9s" begin="-.3s" repeatCount="indefinite"/></rect>
      <rect x="42" y="10" width="4" height="13" rx="2"><animate attributeName="height" values="13;5;13" dur=".7s" begin="-.2s" repeatCount="indefinite"/></rect>
      <rect x="51" y="13" width="4" height="7" rx="2"><animate attributeName="height" values="4;12;4" dur="1.1s" begin="-.6s" repeatCount="indefinite"/></rect>
    </g>
    <text x="68" y="21" fill="#C7D2FE" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" letter-spacing="1">SYSTEMS IN MOTION</text>
  </g>

  <!-- Animated signal trace -->
  <path d="M104 354H1368" stroke="#8198D8" stroke-opacity=".28" stroke-width="1"/>
  <path d="M104 354H210" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round">
    <animate attributeName="d" values="M104 354H210;M104 354H510;M104 354H210" dur="4.5s" repeatCount="indefinite"/>
  </path>
</svg>